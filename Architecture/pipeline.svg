<svg viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a202c">Project Sentinel — Pipeline Architecture</text>
  <text x="650" y="66" text-anchor="middle" font-size="14" fill="#718096">Incremental Auto Loader ingestion · Bronze / Silver / Gold · Unity Catalog · AWS Serverless</text>

  <!-- Source files -->
  <rect x="30" y="130" width="150" height="80" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="105" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3748">Raw CSV files</text>
  <text x="105" y="183" text-anchor="middle" font-size="11" fill="#718096">UC Volume</text>
  <text x="105" y="198" text-anchor="middle" font-size="10" fill="#a0aec0">raw_landing/</text>

  <!-- Auto Loader -->
  <rect x="230" y="130" width="160" height="80" rx="10" fill="#e6fffa" stroke="#38b2ac" stroke-width="1.5"/>
  <text x="310" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#234e52">Auto Loader</text>
  <text x="310" y="176" text-anchor="middle" font-size="11" fill="#285e61">cloudFiles, checkpointed</text>
  <text x="310" y="192" text-anchor="middle" font-size="10" fill="#4a5568">schema evolution: addNewColumns</text>

  <line x1="180" y1="170" x2="228" y2="170" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect x="440" y="120" width="180" height="100" rx="10" fill="#fffaf0" stroke="#cd7f32" stroke-width="2"/>
  <text x="530" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7b341e">BRONZE</text>
  <text x="530" y="170" text-anchor="middle" font-size="11" fill="#7b341e">raw + metadata</text>
  <text x="530" y="186" text-anchor="middle" font-size="10" fill="#975a16">source_file, ingestion_time,</text>
  <text x="530" y="200" text-anchor="middle" font-size="10" fill="#975a16">_rescued_data</text>

  <line x1="390" y1="170" x2="438" y2="170" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Silver quality gate -->
  <rect x="670" y="90" width="200" height="70" rx="10" fill="#ebf8ff" stroke="#4299e1" stroke-width="1.5"/>
  <text x="770" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#2c5282">Quality gate</text>
  <text x="770" y="133" text-anchor="middle" font-size="10" fill="#2b6cb0">amount &gt; 0, dedup by id,</text>
  <text x="770" y="147" text-anchor="middle" font-size="10" fill="#2b6cb0">MERGE upsert</text>

  <line x1="620" y1="150" x2="668" y2="130" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Silver -->
  <rect x="940" y="70" width="190" height="90" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2"/>
  <text x="1035" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#2d3748">SILVER</text>
  <text x="1035" y="117" text-anchor="middle" font-size="11" fill="#4a5568">cleaned, deduped,</text>
  <text x="1035" y="132" text-anchor="middle" font-size="11" fill="#4a5568">schema-evolved</text>

  <line x1="870" y1="122" x2="938" y2="112" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Quarantine -->
  <rect x="670" y="200" width="200" height="70" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <text x="770" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#822727">Quarantine</text>
  <text x="770" y="243" text-anchor="middle" font-size="10" fill="#9b2c2c">invalid rows, preserved</text>
  <text x="770" y="257" text-anchor="middle" font-size="10" fill="#9b2c2c">with quarantine_reason</text>

  <line x1="620" y1="190" x2="668" y2="220" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gold -->
  <rect x="940" y="220" width="190" height="130" rx="10" fill="#fffff0" stroke="#d69e2e" stroke-width="2"/>
  <text x="1035" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#744210">GOLD</text>
  <text x="1035" y="270" text-anchor="middle" font-size="10" fill="#975a16">transaction_summary</text>
  <text x="1035" y="286" text-anchor="middle" font-size="10" fill="#975a16">user_metrics</text>
  <text x="1035" y="302" text-anchor="middle" font-size="10" fill="#975a16">high_value_transactions</text>
  <text x="1035" y="322" text-anchor="middle" font-size="10" fill="#975a16" font-style="italic">(overwrite / recomputed)</text>

  <line x1="1035" y1="160" x2="1035" y2="218" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Anomaly detection -->
  <rect x="940" y="380" width="190" height="90" rx="10" fill="#faf5ff" stroke="#9f7aea" stroke-width="1.5"/>
  <text x="1035" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#44337a">Anomaly Detection</text>
  <text x="1035" y="426" text-anchor="middle" font-size="10" fill="#553c9a">high-value + frequency-spike</text>
  <text x="1035" y="440" text-anchor="middle" font-size="10" fill="#553c9a">rule-based, explainable</text>

  <line x1="1035" y1="350" x2="1035" y2="378" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="940" y="500" width="190" height="80" rx="10" fill="#f0fff4" stroke="#48bb78" stroke-width="1.5"/>
  <text x="1035" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#22543d">SQL Dashboard</text>
  <text x="1035" y="550" text-anchor="middle" font-size="10" fill="#276749">business-facing view</text>
  <text x="1035" y="565" text-anchor="middle" font-size="10" fill="#276749">over Gold tables</text>

  <line x1="1035" y1="470" x2="1035" y2="498" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Audit log spanning bottom -->
  <rect x="230" y="620" width="900" height="80" rx="10" fill="#f7fafc" stroke="#718096" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="680" y="650" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">pipeline_audit_log — every stage logs run_id, status, duration, row counts, error_message</text>
  <text x="680" y="670" text-anchor="middle" font-size="11" fill="#718096">Bronze, Silver, Gold, and Anomaly Detection all write here on every run (success or failure)</text>

  <line x1="530" y1="220" x2="530" y2="618" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="770" y1="270" x2="620" y2="618" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="1035" y1="350" x2="850" y2="618" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="1035" y1="470" x2="950" y2="618" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="30" y="740" font-size="11" fill="#a0aec0">Solid arrows = data flow &#160;&#160;&#160;|&#160;&#160;&#160; Dashed arrows = audit logging (every stage, every run)</text>
</svg>
